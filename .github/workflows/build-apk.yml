name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Auto-Detect Project Directory & Build APK
      run: |
        # If project files were uploaded inside a 'UpiUssd' folder, move into it
        if [ -d "UpiUssd" ]; then
          echo "Found UpiUssd subfolder, moving inside..."
          cd UpiUssd
        fi

        # Make gradlew executable or create it
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          gradle wrapper
          chmod +x gradlew
        fi

        # Build Debug APK
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UpiUssd-app-debug
        path: '**/build/outputs/apk/**/*.apk'
        if-no-files-found: error
